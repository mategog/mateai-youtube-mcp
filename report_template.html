<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MateAI — YouTube Studio & Shorts Experiment Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c222b; --line: #2a313c;
    --text: #e6edf3; --muted: #8b949e;
    --cyan: #58a6ff; --green: #3fb950; --amber: #d29922; --orange: #f0883e; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--cyan); object-fit: cover; background: var(--panel-2); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 3px; font-size: 14px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 13px; }
  .badge b { color: var(--text); font-weight: 600; }
  .badge.live { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); color: var(--green); }
  .badge.coffee { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); color: #f7c843; font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .v small { display: block; font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.hero .v { color: var(--cyan); }
  .tile.top .v { color: var(--green); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
          border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
  .chip.active { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 16%, var(--panel)); font-weight: 600; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
  .list-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 14px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
  tr.row:last-child { border-bottom: none; }
  tr.row:hover { background: var(--panel-2); }
  tr.row.sel { background: color-mix(in srgb, var(--cyan) 14%, var(--panel)); }
  td { padding: 11px 14px; vertical-align: middle; }
  .fmt-pill { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; letter-spacing: 0.04em; display: inline-block; }
  .fmt-short { background: color-mix(in srgb, var(--orange) 22%, transparent); color: var(--orange); }
  .fmt-long { background: color-mix(in srgb, var(--cyan) 22%, transparent); color: var(--cyan); }
  .v-title { font-weight: 600; color: var(--text); }

  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; position: sticky; top: 16px; }
  .detail img.thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 12px; background: var(--panel-2); }
  .detail h2 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; line-height: 1.3; }
  .detail .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .fact { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; }
  .fact .k { color: var(--muted); font-size: 12px; }
  .fact .v { font-weight: 650; font-size: 16px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .section { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 8px; }
  .bar { display: grid; grid-template-columns: 125px 1fr 48px; align-items: center; gap: 8px; font-size: 13px; margin: 7px 0; }
  .bar .track { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; background: var(--c, var(--cyan)); }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .desc-box { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #c9d1d9; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; text-align: center; padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .btn.primary { border-color: color-mix(in srgb, var(--cyan) 50%, var(--line)); color: var(--cyan); }

  footer { color: var(--muted); font-size: 12px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; } .detail { position: static; } .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img id="ch-avatar" src="" alt="Channel Avatar">
      <div>
        <h1 id="ch-title">MateAI</h1>
        <div class="sub" id="ch-sub">Loading channel snapshot…</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge live" id="mode-badge">● Connected</span>
      <span class="badge" id="gen-time"></span>
      <a class="badge coffee" href="https://buymeacoffee.com/mategog" target="_blank" rel="noopener">☕ Buy Mate a Coffee</a>
    </div>
  </header>

  <div class="tiles" id="summary-tiles"></div>

  <div class="chips">
    <button class="chip active" data-filter="all">All Uploads</button>
    <button class="chip" data-filter="short"><i style="background:var(--orange)"></i>Shorts</button>
    <button class="chip" data-filter="long"><i style="background:var(--cyan)"></i>Long-form</button>
  </div>

  <div class="main">
    <div class="list-panel">
      <table>
        <thead>
          <tr>
            <th>Format</th>
            <th>Title</th>
            <th>Published</th>
            <th class="num">Views</th>
            <th class="num">Likes</th>
            <th class="num">Avg % Viewed</th>
            <th class="num">Viewed vs Swiped</th>
          </tr>
        </thead>
        <tbody id="video-tbody"></tbody>
      </table>
    </div>
    <div class="detail" id="detail-panel"></div>
  </div>

  <footer>
    <div>
      Built by <a href="https://www.youtube.com/@mateai-c6m" target="_blank" rel="noopener"><b>MateAI (@mateai-c6m)</b></a> ·
      Source on <a href="https://github.com/mategog/mateai-youtube-mcp" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div>
      Licensed under Apache 2.0 + Commons Clause (Free for creators; commercial resale / paid SaaS hosting prohibited).
    </div>
  </footer>
</div>

<script>
const SNAP = __SNAPSHOT_JSON__;

function fmtNum(n) {
  return (n === null || n === undefined) ? "—" : Number(n).toLocaleString();
}
function fmtDur(sec) {
  if (!sec) return "—";
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

const ch = SNAP.channel || {};
document.getElementById("ch-title").textContent = `${ch.title || "MateAI"} (${ch.handle || "@mateai-c6m"})`;
document.getElementById("ch-sub").textContent = `${ch.subscribersText || ""} · ${ ch.description || "Your AI mate — building real things with AI." }`;
if (ch.avatarUrl) document.getElementById("ch-avatar").src = ch.avatarUrl;
document.getElementById("mode-badge").textContent = SNAP.mode === "studio_oauth" ? "● Studio OAuth2 Live" : "● Public Snapshot Mode";
document.getElementById("gen-time").textContent = `Updated ${SNAP.generatedAt}`;

const vids = SNAP.videos || [];
const shorts = vids.filter(v => v.format === "short");
const longs = vids.filter(v => v.format === "long");
const topV = SNAP.totals?.topVideo || vids[0] || {};
const shortsViews = shorts.reduce((a, b) => a + (b.views || 0), 0);
const longViews = longs.reduce((a, b) => a + (b.views || 0), 0);

document.getElementById("summary-tiles").innerHTML = `
  <div class="tile hero">
    <div class="k">Total Channel Views</div>
    <div class="v">${fmtNum(SNAP.totals?.totalViews || 0)}<small>Across ${vids.length} public uploads</small></div>
  </div>
  <div class="tile top">
    <div class="k">Top Upload</div>
    <div class="v">${fmtNum(topV.views || 0)}<small title="${topV.title || ''}">${topV.title || "—"}</small></div>
  </div>
  <div class="tile">
    <div class="k">Shorts Performance</div>
    <div class="v">${fmtNum(shortsViews)}<small>${shorts.length} Shorts · avg ${shorts.length ? Math.round(shortsViews / shorts.length) : 0} views</small></div>
  </div>
  <div class="tile">
    <div class="k">Long-Form Build Logs</div>
    <div class="v">${fmtNum(longViews)}<small>${longs.length} Videos · avg ${longs.length ? Math.round(longViews / longs.length) : 0} views</small></div>
  </div>
`;

let activeFilter = "all";
let selectedId = topV.videoId || (vids[0] && vids[0].videoId);

function renderDetail(v) {
  const el = document.getElementById("detail-panel");
  if (!v) { el.innerHTML = "<div class='meta'>No video selected</div>"; return; }
  const maxViews = Math.max(...vids.map(x => x.views || 1), 1);
  const viewBarPct = Math.min(100, Math.round(((v.views || 0) / maxViews) * 100));
  const avgPct = v.avgViewPct ?? null;
  const swpPct = v.viewedVsSwipedPct ?? null;

  el.innerHTML = `
    <img class="thumb" src="${v.thumbnail}" alt="">
    <h2>${v.title}</h2>
    <div class="meta">${v.format === "short" ? "YouTube Short" : "Long-form Video"} · Published ${v.publishDate || "—"} · ${fmtDur(v.durationSec)}</div>
    <div class="facts">
      <div class="fact"><div class="k">Views</div><div class="v">${fmtNum(v.views)}</div></div>
      <div class="fact"><div class="k">Likes</div><div class="v">${fmtNum(v.likes)}</div></div>
      <div class="fact"><div class="k">Engaged Views</div><div class="v">${v.engagedViews != null ? fmtNum(v.engagedViews) : "Studio OAuth"}</div></div>
      <div class="fact"><div class="k">Subs Gained</div><div class="v">${v.subsGained != null ? "+" + v.subsGained : "Studio OAuth"}</div></div>
    </div>
    <div class="section">Retention & Relative Reach</div>
    <div class="bar" style="--c:var(--cyan)">
      <span>Reach vs Top</span>
      <div class="track"><div class="fill" style="width:${viewBarPct}%"></div></div>
      <span class="n">${viewBarPct}%</span>
    </div>
    <div class="bar" style="--c:var(--green)">
      <span>Avg % Viewed</span>
      <div class="track"><div class="fill" style="width:${avgPct || 0}%"></div></div>
      <span class="n">${avgPct != null ? avgPct + "%" : "OAuth"}</span>
    </div>
    <div class="bar" style="--c:var(--orange)">
      <span>Viewed vs Swiped</span>
      <div class="track"><div class="fill" style="width:${swpPct || 0}%"></div></div>
      <span class="n">${swpPct != null ? swpPct + "%" : "OAuth"}</span>
    </div>
    <div class="section">Description Preview</div>
    <div class="desc-box">${v.descriptionPreview || "No description"}</div>
    <div class="actions">
      <a class="btn primary" href="${v.url}" target="_blank" rel="noopener">Watch on YouTube ↗</a>
      <a class="btn" href="https://studio.youtube.com/video/${v.videoId}/analytics/tab-overview/period-default" target="_blank" rel="noopener">Open in Studio ↗</a>
    </div>
  `;
}

function renderTable() {
  const tbody = document.getElementById("video-tbody");
  const filtered = vids.filter(v => activeFilter === "all" || v.format === activeFilter);
  tbody.innerHTML = filtered.map(v => `
    <tr class="row ${v.videoId === selectedId ? 'sel' : ''}" data-id="${v.videoId}">
      <td><span class="fmt-pill ${v.format === 'short' ? 'fmt-short' : 'fmt-long'}">${v.format}</span></td>
      <td class="v-title">${v.title}</td>
      <td>${v.publishDate || "—"}</td>
      <td class="num"><b>${fmtNum(v.views)}</b></td>
      <td class="num">${fmtNum(v.likes)}</td>
      <td class="num">${v.avgViewPct != null ? v.avgViewPct.toFixed(1) + "%" : "—"}</td>
      <td class="num">${v.viewedVsSwipedPct != null ? v.viewedVsSwipedPct.toFixed(1) + "%" : "—"}</td>
    </tr>
  `).join("");

  tbody.querySelectorAll("tr.row").forEach(tr => {
    tr.addEventListener("click", () => {
      selectedId = tr.dataset.id;
      renderTable();
      renderDetail(vids.find(x => x.videoId === selectedId));
    });
  });
}

document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderTable();
  });
});

renderTable();
renderDetail(vids.find(x => x.videoId === selectedId) || vids[0]);
</script>
</body>
</html>
